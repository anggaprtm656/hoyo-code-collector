name: Auto Collect HoYo Codes

on:
  schedule:
    - cron: '15,45 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'data/**'
      - 'code/**'
      - 'README.md'

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Collector Script
        run: |
          python collector.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ code/
          if git diff --staged --quiet; then
            echo "Tidak ada kode baru yang berubah. Skip commit."
          else
            git commit -m "Auto: Update promo codes [skip ci]"
            git push
          fi
